            background-color: #FFFFFF;
            color: #1F2937;
            overflow-x: hidden;
        }
        h1, h2, h3, h4, h5, h6 { font-family: 'Inter', sans-serif; }
        .gradient-text {
            background: linear-gradient(135deg, #4F46E5, #10B981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4F46E5, #10B981);
            color: white;
            padding: 14px 32px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-block;
            text-decoration: none;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px #4F46E540;
        }
        .btn-secondary {
            background: transparent;
            color: #1F2937;
            padding: 14px 32px;
            border-radius: 12px;
            font-weight: 600;
            border: 2px solid #4F46E530;
            transition: all 0.3s ease;
            display: inline-block;
            text-decoration: none;
        }
        .btn-secondary:hover {
            border-color: #4F46E5;
            background: #4F46E510;
        }
        .section { padding: 100px 0; }
        .container { max-width: 1280px; margin: 0 auto; padding: 0 24px; }
        .animate-on-scroll { opacity: 0; transform: translateY(40px); }
        .nav-link { transition: color 0.3s ease; }
        .nav-link:hover { color: #4F46E5; }
        .nav-link.active { color: #4F46E5; font-weight: 600; }

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script>
        gsap.registerPlugin(ScrollTrigger);
        gsap.utils.toArray('.animate-on-scroll').forEach((element, index) => {
            gsap.fromTo(element, 
                { opacity: 0, y: 100, scale: 0.8 },
                { opacity: 1, y: 0, scale: 1, duration: 1, ease: "elastic.out(1, 0.5)",
                  scrollTrigger: { trigger: element, start: "top 90%", toggleActions: "play none none reverse" },
                  delay: index * 0.05
                }
            );
        });
        </script>
    
    <!-- Smooth scroll and active nav highlighting -->
    <script>
        // Highlight active nav link on scroll
        const sections = document.querySelectorAll('section[id]');
        const navLinks = document.querySelectorAll('.nav-link');
        
        window.addEventListener('scroll', () => {
            let current = '';
            sections.forEach(section => {
                const sectionTop = section.offsetTop - 100;
                if (window.scrollY >= sectionTop) {
                    current = section.getAttribute('id');
                }
            });
            
            navLinks.forEach(link => {
                link.classList.remove('active');
                if (link.getAttribute('href') === '#' + current) {
                    link.classList.add('active');
                }
            });
        });
    </script>
